<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dribble clone</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css" rel="stylesheet" />
</head>

<body>
  <div class="nav">
    <div class="navleft">
      <img src="https://images.seeklogo.com/logo-png/27/1/dribbble-logo-png_seeklogo-273044.png" alt="">
      <div class="searchbox">
        <h5>What are you looking for?</h5>
        <div class="boxright">
          <h5>Shots</h5>
          <div class="searchicon"><i class="ri-search-line"></i></div>
        </div>
      </div>
      <h4>Explore</h4>
      <h4>Hire Talent</h4>
      <h4>Get Hired</h4>
      <h4>Community</h4>
    </div>
    <div class="navright">
      <h4>Sign up</h4>
      <h4>Log in</h4>
    </div>
  </div>
  <div class="main">
    <div class="card">
      <img
        src="https://images.unsplash.com/photo-1484406566174-9da000fda645?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Nnx8YW5pbWFsc3xlbnwwfHwwfHx8MA%3D%3D"
        alt="animal picture">
      <div class="bottom">
        <h4>Animals</h4>
        <h3><i class="ri-heart-fill"></i></h3>
      </div>
    </div>
    <div class="card">
      <img
        src="https://images.prismic.io/virginexperiencedays/8eada24c-eef5-4831-b91f-ed704f3e1203_kamil-pietrzak-H22w-tq0SeQ-unsplash.jpg?auto=compress,format">
      <div class="bottom">
        <h4>Sky Diving</h4>
        <h3><i class="ri-heart-fill"></i></h3>
      </div>
    </div>
    <div class="card">
      <img
        src="https://img.freepik.com/free-photo/beautiful-girl-standing-boat-looking-mountains-ratchaprapha-dam-khao-sok-national-park-surat-thani-province-thailand_335224-849.jpg?semt=ais_hybrid&w=740&q=80"
        alt="travel picture">
      <div class="bottom">
        <h4>Travel</h4>
        <h3><i class="ri-heart-fill"></i></h3>
      </div>
    </div>
    <div class="card">
      <img
        src="https://www.springboard.com/blog/wp-content/uploads/2022/06/what-does-a-coder-do-2022-career-guide-1.jpg"
        alt="coder picture">
      <div class="bottom">
        <h4>Code</h4>
        <h3><i class="ri-heart-fill"></i></h3>
      </div>
    </div>
  </div>
</body>

</html>
